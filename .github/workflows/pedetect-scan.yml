name: pedetect Scan

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  scan-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pedetect
        run: |
          pip install .
          pip install pefile rich regex

      - name: Download Release Artifacts
        if: github.event_name == 'release'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: 'latest'
          regex: true
          file: '.*\.(exe|dll)$'
          target: './artifacts/'

      - name: Run pedetect Scan
        run: |
          mkdir -p scan-results
          for file in ./artifacts/*; do
            if [[ -f "$file" ]]; then
              echo "Scanning $file..."
              pedetect "$file" --json -f "scan-results/$(basename "$file").json"
              VERDICT=$(jq -r '.verdict' "scan-results/$(basename "$file").json")
              if [[ "$VERDICT" == "PACKED" ]]; then
                echo "CRITICAL: $file is flagged as PACKED!"
                exit 1
              fi
            fi
          done

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: pedetect-results
          path: scan-results/
