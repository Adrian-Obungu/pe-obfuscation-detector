[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pedetect"
version = "0.3.0"
description = "PE Binary Obfuscation Detector"
authors = [{name = "Adrian S. Obungu", email = "adrian.obungu@gmail.com"}]
dependencies = [
    "pefile",
    "rich",
    "regex",
    "pydantic",
    "loguru"
]

[project.scripts]
pedetect = "pedetect.cli:main"

[tool.setuptools.package-data]
pedetect = ["config.json", "signatures.json", "weights.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
